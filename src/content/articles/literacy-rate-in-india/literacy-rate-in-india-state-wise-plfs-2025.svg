<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="image-title image-description">
  <title id="image-title">Literacy Rate in India: PLFS 2025 State Comparison</title>
  <desc id="image-description">India's age-seven-plus literacy estimate is 81.1%. The three highest state estimates are Mizoram 99.8%, Kerala 95.6% and Nagaland 94.5%; the three lowest are Rajasthan 74.0%, Bihar 73.1% and Andhra Pradesh 71.4%. Bars use a zero-to-100 scale. An open book represents literacy. Source: NSO PLFS 2025 Table (7), January-December 2025; not Census data.</desc>
  <rect width="1200" height="630" fill="#fffbeb"/>
  <rect x="30" y="30" width="1140" height="570" rx="18" fill="#fff" stroke="#e5e7eb"/>
  <rect x="30" y="30" width="12" height="570" rx="6" fill="#ff8c00"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="91" fill="#92400e" font-size="19" font-weight="700" letter-spacing="2">SCES INDIA / EDUCATION STATISTICS</text>
    <text x="80" y="157" fill="#111827" font-size="47" font-weight="700">Literacy Rate</text>
    <text x="80" y="211" fill="#111827" font-size="47" font-weight="700">in India</text>
    <text x="80" y="319" fill="#1e3a8a" font-size="88" font-weight="700">81.1%</text>
    <text x="83" y="353" fill="#374151" font-size="24">All India, age 7+</text>
    <text x="83" y="389" fill="#4b5563" font-size="20">January-December 2025</text>
    <text x="560" y="142" fill="#111827" font-size="29" font-weight="700">State-Wise Comparison</text>
    <text x="560" y="170" fill="#4b5563" font-size="17">Three highest and three lowest state estimates</text>
    <g stroke="#e5e7eb" stroke-width="1">
      <path d="M748 205V490 M818 205V490 M888 205V490 M958 205V490 M1028 205V490"/>
    </g>
    <g fill="#4b5563" font-size="14" text-anchor="middle">
      <text x="748" y="197">0</text><text x="818" y="197">25</text><text x="888" y="197">50</text><text x="958" y="197">75</text><text x="1028" y="197">100%</text>
    </g>
    <g fill="#e5e7eb">
      <rect x="748" y="220" width="280" height="18" rx="2"/>
      <rect x="748" y="266" width="280" height="18" rx="2"/>
      <rect x="748" y="312" width="280" height="18" rx="2"/>
      <rect x="748" y="378" width="280" height="18" rx="2"/>
      <rect x="748" y="424" width="280" height="18" rx="2"/>
      <rect x="748" y="470" width="280" height="18" rx="2"/>
    </g>
    <g fill="#1e3a8a">
      <rect data-state="Mizoram" x="748" y="220" width="279.44" height="18" rx="2"/>
      <rect data-state="Kerala" x="748" y="266" width="267.68" height="18" rx="2"/>
      <rect data-state="Nagaland" x="748" y="312" width="264.6" height="18" rx="2"/>
    </g>
    <g fill="#c2410c">
      <rect data-state="Rajasthan" x="748" y="378" width="207.2" height="18" rx="2"/>
      <rect data-state="Bihar" x="748" y="424" width="204.68" height="18" rx="2"/>
      <rect data-state="Andhra Pradesh" x="748" y="470" width="199.92" height="18" rx="2"/>
    </g>
    <g fill="#374151" font-size="21">
      <text x="560" y="237">Mizoram</text><text x="560" y="283">Kerala</text><text x="560" y="329">Nagaland</text>
      <text x="560" y="395">Rajasthan</text><text x="560" y="441">Bihar</text><text x="560" y="487">Andhra Pradesh</text>
    </g>
    <g fill="#111827" font-size="23" font-weight="700" text-anchor="end">
      <text x="1130" y="237">99.8%</text><text x="1130" y="283">95.6%</text><text x="1130" y="329">94.5%</text>
      <text x="1130" y="395">74.0%</text><text x="1130" y="441">73.1%</text><text x="1130" y="487">71.4%</text>
    </g>
    <text x="80" y="570" fill="#4b5563" font-size="17">Source: NSO PLFS 2025, Table (7). Survey estimates, rural + urban; not Census data.</text>
  </g>
  <g transform="translate(85 425)" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round">
    <path d="M0 10Q49-4 94 12V84Q49 64 0 79Z" fill="#fef3c7"/>
